version: '3.9'

services:
  mongo-primary:
    image: mongo:7
    container_name: evote-mongo-primary
    restart: unless-stopped
    command: ["--replSet", "evote-rs", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: evote
    volumes:
      - mongo-primary-data:/data/db

  mongo-secondary:
    image: mongo:7
    container_name: evote-mongo-secondary
    restart: unless-stopped
    command: ["--replSet", "evote-rs", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-secondary-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: evote-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: evote-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: evote-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api:
    image: node:20-alpine
    container_name: evote-api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - mongo-primary
      - mongo-secondary
      - redis
      - kafka
    ports:
      - "5001:5001"
    env_file:
      - .env.scalable.example
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/app

volumes:
  mongo-primary-data:
  mongo-secondary-data:
  redis-data:
